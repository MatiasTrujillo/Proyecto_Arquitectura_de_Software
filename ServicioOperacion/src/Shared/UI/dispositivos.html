<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispositivos GPS - ServicioOperacion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        .nav { margin-bottom: 20px; }
        a { padding: 8px 12px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        .formulario {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .btn-eliminar { padding: 5px 10px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-eliminar:hover { background: #990000; }
        .btn-editar { padding: 5px 10px; background: #e07b00; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-editar:hover { background: #b56200; }
        .btn-cancelar { padding: 8px 15px; background: #888; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; margin-left: 8px; }
        .btn-cancelar:hover { background: #666; }
        .error { color: red; margin-top: 10px; }
        .exito { color: green; margin-top: 10px; }
        .oculto { display: none; }
    </style>
</head>
<body>
    <div class="nav"><a href="/">← Volver</a></div>
    <h1>Gestión de Dispositivos GPS</h1>

    <!-- Formulario crear -->
    <div class="formulario" id="formularioCrear">
        <h2>Crear Dispositivo</h2>
        <label>Ubicación</label>
        <input type="text" id="ubicacion" placeholder="Ej: -34.6037,-58.3816">
        <br>
        <button onclick="crearDispositivo()">Crear</button>
        <div id="mensajeCrear"></div>
    </div>

    <!-- Formulario editar -->
    <div class="formulario oculto" id="formularioEditar">
        <h2>Editar Dispositivo <span id="tituloIdEditar"></span></h2>
        <input type="hidden" id="editarId">
        <label>Ubicación</label>
        <input type="text" id="editarUbicacion">
        <br>
        <button onclick="guardarEdicion()">Guardar cambios</button>
        <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
        <div id="mensajeEditar"></div>
    </div>

    <h2>Listado</h2>
    <table id="tablaDispositivos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ubicación</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="3">Cargando...</td></tr>
        </tbody>
    </table>

    <script>
        async function cargarDispositivos() {
            try {
                const respuesta = await fetch('/api/dispositivos');
                const json = await respuesta.json();
                const dispositivos = json.data || [];

                const tbody = document.querySelector('#tablaDispositivos tbody');
                if (dispositivos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No hay dispositivos</td></tr>';
                    return;
                }

                tbody.innerHTML = dispositivos.map(d => `
                    <tr>
                        <td>${d.id}</td>
                        <td>${d.ubicacion}</td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicion(${d.id}, '${d.ubicacion}')">Editar</button>
                            <button class="btn-eliminar" onclick="eliminarDispositivo(${d.id})">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.querySelector('#tablaDispositivos tbody').innerHTML =
                    `<tr><td colspan="3" class="error">Error: ${err.message}</td></tr>`;
            }
        }

        async function crearDispositivo() {
            const ubicacion = document.getElementById('ubicacion').value;
            if (!ubicacion) {
                document.getElementById('mensajeCrear').innerHTML = '<div class="error">Completá la ubicación</div>';
                return;
            }

            try {
                const respuesta = await fetch('/api/dispositivos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ubicacion })
                });

                if (respuesta.ok) {
                    document.getElementById('mensajeCrear').innerHTML = '<div class="exito">Dispositivo creado</div>';
                    document.getElementById('ubicacion').value = '';
                    cargarDispositivos();
                } else {
                    const err = await respuesta.json();
                    document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        function abrirEdicion(id, ubicacion) {
            document.getElementById('formularioEditar').classList.remove('oculto');
            document.getElementById('formularioCrear').classList.add('oculto');
            document.getElementById('tituloIdEditar').textContent = `#${id}`;
            document.getElementById('editarId').value = id;
            document.getElementById('editarUbicacion').value = ubicacion;
            document.getElementById('mensajeEditar').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('formularioEditar').classList.add('oculto');
            document.getElementById('formularioCrear').classList.remove('oculto');
        }

        async function guardarEdicion() {
            const id = document.getElementById('editarId').value;
            const ubicacion = document.getElementById('editarUbicacion').value;

            if (!ubicacion) {
                document.getElementById('mensajeEditar').innerHTML = '<div class="error">Completá la ubicación</div>';
                return;
            }

            try {
                const respuesta = await fetch(`/api/dispositivos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ubicacion })
                });

                if (respuesta.ok) {
                    document.getElementById('mensajeEditar').innerHTML = '<div class="exito">Dispositivo actualizado</div>';
                    cargarDispositivos();
                    setTimeout(cancelarEdicion, 1000);
                } else {
                    const err = await respuesta.json();
                    document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function eliminarDispositivo(id) {
            if (!confirm('¿Eliminar este dispositivo?')) return;
            try {
                const respuesta = await fetch(`/api/dispositivos/${id}`, { method: 'DELETE' });
                if (respuesta.ok) cargarDispositivos();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        cargarDispositivos();
        setInterval(cargarDispositivos, 5000);
    </script>
</body>
</html>
