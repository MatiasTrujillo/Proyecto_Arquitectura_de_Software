<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo de Traslados - Operador</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      background: #1a1a2e; color: white; padding: 12px 20px;
      display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    }
    .topbar h1 { font-size: 18px; font-weight: bold; }
    .topbar a { color: #aac4ff; text-decoration: none; font-size: 13px; }
    .topbar a:hover { color: white; }
    .badge-total {
      background: #0066cc; color: white; padding: 3px 10px;
      border-radius: 12px; font-size: 12px; margin-left: auto;
    }
    .badge-alerta-total {
      background: #cc0000; color: white; padding: 3px 10px;
      border-radius: 12px; font-size: 12px;
    }
    .refresh-label { font-size: 12px; color: #aaa; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* Panel izquierdo: lista de viajes */
    .panel-left {
      width: 340px; min-width: 280px; background: white;
      border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0;
    }
    .panel-left h2 { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #eee; background: #fafafa; }
    .filtros {
      padding: 10px 16px; border-bottom: 1px solid #eee; background: #f7f9ff; flex-shrink: 0;
    }
    .filtros label { font-size: 11px; color: #555; display: block; margin-top: 6px; }
    .filtros input[type="text"] {
      width: 100%; padding: 5px 7px; font-size: 12px; border: 1px solid #ccd;
      border-radius: 4px; box-sizing: border-box; margin-top: 2px;
    }
    .filtros-check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #333; }
    .filtros-btns { display: flex; gap: 6px; margin-top: 8px; }
    .btn-filtrar { flex: 1; padding: 5px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-filtrar:hover { background: #0052a3; }
    .btn-limpiar { flex: 1; padding: 5px; background: #888; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-limpiar:hover { background: #666; }
    .filtros-activos { font-size: 11px; color: #0066cc; margin-top: 4px; font-style: italic; }
    .viajes-list { overflow-y: auto; flex: 1; }
    .viaje-card {
      padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      transition: background 0.1s;
    }
    .viaje-card:hover { background: #f5f8ff; }
    .viaje-card.activo { background: #eaf2ff; border-left: 3px solid #0066cc; }
    .viaje-card.con-alerta { border-left: 3px solid #cc0000; }
    .viaje-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .viaje-id { font-size: 11px; color: #888; font-family: monospace; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: bold;
    }
    .badge-Pendiente { background: #fff3cd; color: #856404; }
    .badge-EnCurso   { background: #d1ecf1; color: #0c5460; }
    .badge-encurso   { background: #d1ecf1; color: #0c5460; }
    .badge-alerta    { background: #cc0000; color: white; margin-left: 4px; }
    .viaje-ruta { font-size: 13px; color: #333; margin-bottom: 2px; }
    .viaje-ruta strong { color: #0066cc; }
    .viaje-info { font-size: 11px; color: #666; }
    .viaje-pos { font-size: 11px; color: #888; margin-top: 3px; font-family: monospace; }
    .sin-viajes { padding: 24px 16px; color: #888; font-style: italic; text-align: center; }

    /* Panel alertas */
    .panel-alertas {
      background: white; border-top: 1px solid #ddd;
      max-height: 180px; overflow-y: auto; flex-shrink: 0;
    }
    .panel-alertas h3 { padding: 8px 16px; font-size: 13px; background: #fff5f5; border-bottom: 1px solid #fdd; color: #900; }
    .alerta-item {
      padding: 6px 16px; border-bottom: 1px solid #fff0f0; font-size: 12px;
      display: flex; gap: 8px; align-items: baseline;
    }
    .alerta-hora { color: #999; font-size: 11px; white-space: nowrap; }
    .alerta-tipo { font-weight: bold; color: #cc0000; min-width: 120px; }
    .alerta-desc { color: #555; }
    .sin-alertas { padding: 10px 16px; color: #888; font-size: 12px; font-style: italic; }

    /* Mapa */
    #mapa { flex: 1; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="http://localhost:3001/">← Volver</a>
  <h1>Monitoreo de Traslados en Curso</h1>
  <span class="badge-total" id="totalViajes">0 viajes</span>
  <span class="badge-alerta-total" id="totalAlertas" style="display:none">0 alertas</span>
  <span class="refresh-label" id="ultimaActualizacion"></span>
</div>

<div class="main">
  <div class="panel-left">
    <h2>Traslados activos</h2>
    <div class="filtros">
      <label>Vehículo</label>
      <input type="text" id="filtroVehiculo" placeholder="Matrícula">
      <label>Conductor</label>
      <input type="text" id="filtroConductor" placeholder="Cédula del conductor">
      <label>Categoría</label>
      <input type="text" id="filtroCategoria" placeholder="Ej: electrónica">
      <div class="filtros-check">
        <input type="checkbox" id="filtroAlertas">
        <label for="filtroAlertas" style="margin:0">Solo con alertas</label>
      </div>
      <div class="filtros-btns">
        <button class="btn-filtrar" onclick="aplicarFiltros()">Filtrar</button>
        <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
      </div>
      <div class="filtros-activos" id="filtrosActivos"></div>
    </div>
    <div class="viajes-list" id="viajesList">
      <div class="sin-viajes">Cargando...</div>
    </div>
    <div class="panel-alertas">
      <h3>⚠ Alertas recientes</h3>
      <div id="alertasList"><div class="sin-alertas">Sin alertas recientes.</div></div>
    </div>
  </div>

  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Auth guard — solo Operador y Administrador
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || sessionStorage.getItem('auth_token');
  const rolParam = params.get('rol') || sessionStorage.getItem('auth_rol');
  if (token) sessionStorage.setItem('auth_token', token);
  if (rolParam) sessionStorage.setItem('auth_rol', rolParam);

  function rolDesdeJwt(t) {
    try { return JSON.parse(atob(t.split('.')[1])).rol || null; } catch { return null; }
  }
  const rol = token ? (rolDesdeJwt(token) || rolParam) : rolParam;
  const rolesPermitidos = ['Operador', 'operador', 'Administrador', 'administrador'];

  if (!token) {
    window.location.href = 'http://localhost:3002/';
  } else if (!rolesPermitidos.includes(rol)) {
    document.body.innerHTML = '<div style="padding:40px;font-family:Arial"><h2>Acceso denegado</h2><p>Esta página es solo para Operadores y Administradores.</p><a href="javascript:history.back()" style="color:#0066cc">← Volver</a></div>';
  }

  // Mapa centrado en Montevideo
  const mapa = L.map('mapa').setView([-34.905, -56.185], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(mapa);

  // Estado
  const marcadores = {};   // matricula → L.marker
  const viajesData = {};   // id → viaje
  let alertasRecientes = [];
  let totalAlertasContadas = 0;
  let filtrosActuales = {};

  function aplicarFiltros() {
    const vehiculo  = document.getElementById('filtroVehiculo').value.trim();
    const conductor = document.getElementById('filtroConductor').value.trim();
    const categoria = document.getElementById('filtroCategoria').value.trim();
    const alertas   = document.getElementById('filtroAlertas').checked;

    filtrosActuales = {};
    if (vehiculo)  filtrosActuales.vehiculo  = vehiculo;
    if (conductor) filtrosActuales.conductor = conductor;
    if (categoria) filtrosActuales.categoria = categoria;
    if (alertas)   filtrosActuales.tieneAlertas = 'true';

    const activos = Object.keys(filtrosActuales).length;
    document.getElementById('filtrosActivos').textContent =
      activos > 0 ? `${activos} filtro${activos > 1 ? 's' : ''} activo${activos > 1 ? 's' : ''}` : '';

    actualizar();
  }

  function limpiarFiltros() {
    document.getElementById('filtroVehiculo').value  = '';
    document.getElementById('filtroConductor').value = '';
    document.getElementById('filtroCategoria').value = '';
    document.getElementById('filtroAlertas').checked = false;
    filtrosActuales = {};
    document.getElementById('filtrosActivos').textContent = '';
    actualizar();
  }

  // Icono normal (azul) y con alerta (rojo)
  const iconoNormal = L.divIcon({
    className: '',
    html: '<div style="background:#0066cc;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
    iconSize: [14, 14], iconAnchor: [7, 7],
  });
  const iconoAlerta = L.divIcon({
    className: '',
    html: '<div style="background:#cc0000;width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8],
  });

  // Cargar zonas rojas como polígonos en el mapa
  async function cargarZonas() {
    try {
      const resp = await fetch('/api/zonas-rojas');
      if (!resp.ok) return;
      const json = await resp.json();
      for (const zona of (json.data || [])) {
        try {
          const coords = JSON.parse(zona.delimitacion);
          L.polygon(coords, {
            color: '#cc0000', fillColor: '#ff000033',
            fillOpacity: 0.25, weight: 2,
          }).addTo(mapa).bindTooltip(`🔴 ${zona.nombre}`, { permanent: false });
        } catch {}
      }
    } catch {}
  }

  // Actualizar marcador de un vehículo en el mapa
  async function actualizarPosicionVehiculo(viaje) {
    if (!viaje.vehiculo) return;
    try {
      const resp = await fetch(`/api/ubicaciones/ultima?vehiculo=${encodeURIComponent(viaje.vehiculo)}`);
      if (!resp.ok) return;
      const json = await resp.json();
      const pos = json.data;
      if (!pos) return;

      const latlng = [pos.lat, pos.lng];
      const icono = viaje.tiene_alertas ? iconoAlerta : iconoNormal;
      const popupText = `<b>${viaje.vehiculo}</b><br>
        Conductor: ${viaje.conductor || '—'}<br>
        ${viaje.origen} → ${viaje.destino}<br>
        Vel: ${pos.velocidad?.toFixed(0) ?? '?'} km/h<br>
        <small>${new Date(pos.timestamp).toLocaleTimeString('es-AR')}</small>`;

      if (marcadores[viaje.vehiculo]) {
        marcadores[viaje.vehiculo].setLatLng(latlng).setIcon(icono).setPopupContent(popupText);
      } else {
        marcadores[viaje.vehiculo] = L.marker(latlng, { icon: icono })
          .addTo(mapa)
          .bindPopup(popupText);
      }

      // Guardar posición en el objeto viaje para mostrar en panel
      viaje._pos = pos;
    } catch {}
  }

  // Eliminar marcadores de vehículos que ya no están activos
  function limpiarMarcadores(vehiculosActivos) {
    for (const mat of Object.keys(marcadores)) {
      if (!vehiculosActivos.has(mat)) {
        mapa.removeLayer(marcadores[mat]);
        delete marcadores[mat];
      }
    }
  }

  // Cargar alertas recientes de todos los vehículos activos
  async function cargarAlertas(vehiculos) {
    const todasAlertas = [];
    await Promise.all(vehiculos.map(async (mat) => {
      try {
        const resp = await fetch(`/api/alertas?vehiculo=${encodeURIComponent(mat)}`);
        if (!resp.ok) return;
        const json = await resp.json();
        for (const a of (json.data || [])) {
          todasAlertas.push({ ...a, vehiculo: mat });
        }
      } catch {}
    }));
    todasAlertas.sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
    totalAlertasContadas = todasAlertas.length;
    alertasRecientes = todasAlertas.slice(0, 20);
    renderAlertas();
  }

  function renderAlertas() {
    const el = document.getElementById('alertasList');
    if (alertasRecientes.length === 0) {
      el.innerHTML = '<div class="sin-alertas">Sin alertas recientes.</div>';
      return;
    }
    el.innerHTML = alertasRecientes.map(a => `
      <div class="alerta-item">
        <span class="alerta-hora">${new Date(a.timestamp).toLocaleTimeString('es-AR')}</span>
        <span class="alerta-tipo">${formatTipo(a.tipo)}</span>
        <span class="alerta-desc">${a.descripcion || ''}</span>
      </div>
    `).join('');

    const totalAl = document.getElementById('totalAlertas');
    if (totalAlertasContadas > 0) {
      totalAl.style.display = 'inline-block';
      totalAl.textContent = `${totalAlertasContadas} alerta${totalAlertasContadas > 1 ? 's' : ''}`;
    } else {
      totalAl.style.display = 'none';
    }
  }

  function formatTipo(tipo) {
    if (tipo === 'zona_roja') return '🔴 Zona roja';
    if (tipo === 'detencion_prolongada') return '🛑 Detención';
    return tipo;
  }

  // Render panel lateral de viajes
  function renderViajes(viajes) {
    const el = document.getElementById('viajesList');
    document.getElementById('totalViajes').textContent = `${viajes.length} viaje${viajes.length !== 1 ? 's' : ''}`;

    if (viajes.length === 0) {
      el.innerHTML = '<div class="sin-viajes">No hay traslados activos en este momento.</div>';
      return;
    }

    el.innerHTML = viajes.map(v => {
      const estadoKey = (v.estado || '').replace(/\s/g, '');
      const alertaBadge = v.tiene_alertas ? '<span class="badge badge-alerta">⚠ Alerta</span>' : '';
      const posText = v._pos
        ? `📍 ${v._pos.lat.toFixed(5)}, ${v._pos.lng.toFixed(5)} — ${v._pos.velocidad?.toFixed(0) ?? '?'} km/h`
        : '📍 Sin posición GPS aún';
      return `
        <div class="viaje-card ${v.tiene_alertas ? 'con-alerta' : ''}" onclick="centrarEnVehiculo('${v.vehiculo || ''}')">
          <div class="viaje-header">
            <span class="viaje-id">#${v.id?.toString().slice(0, 8) ?? v.id}</span>
            <span>
              <span class="badge badge-${estadoKey}">${v.estado}</span>
              ${alertaBadge}
            </span>
          </div>
          <div class="viaje-ruta"><strong>${v.origen}</strong> → <strong>${v.destino}</strong></div>
          <div class="viaje-info">🚗 ${v.vehiculo || '—'} &nbsp;|&nbsp; 👤 ${v.conductor || '—'}</div>
          <div class="viaje-pos">${posText}</div>
        </div>
      `;
    }).join('');
  }

  function centrarEnVehiculo(matricula) {
    if (matricula && marcadores[matricula]) {
      mapa.setView(marcadores[matricula].getLatLng(), 16);
      marcadores[matricula].openPopup();
    }
  }

  // Ciclo principal de actualización
  async function actualizar() {
    try {
      const qs = new URLSearchParams(filtrosActuales).toString();
      const resp = await fetch(`/api/proxy/viajes-en-curso${qs ? '?' + qs : ''}`);
      if (!resp.ok) return;
      const json = await resp.json();
      const viajes = json.data || [];

      const vehiculosActivos = new Set(viajes.filter(v => v.vehiculo).map(v => v.vehiculo));

      // Actualizar posición de cada vehículo en paralelo
      await Promise.all(viajes.map(v => actualizarPosicionVehiculo(v)));

      limpiarMarcadores(vehiculosActivos);
      renderViajes(viajes);
      await cargarAlertas([...vehiculosActivos]);

      document.getElementById('ultimaActualizacion').textContent =
        `Actualizado: ${new Date().toLocaleTimeString('es-AR')}`;
    } catch (e) {
      console.error('Error al actualizar:', e);
    }
  }

  // Inicio
  cargarZonas();
  actualizar();
  setInterval(actualizar, 5000);
</script>
</body>
</html>
