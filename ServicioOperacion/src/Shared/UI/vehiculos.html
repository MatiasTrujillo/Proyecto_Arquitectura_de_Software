<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - ServicioOperacion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        .nav { margin-bottom: 20px; }
        a { padding: 8px 12px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        .formulario {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            background: white;
        }
        button {
            padding: 8px 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .btn-eliminar { padding: 5px 10px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-eliminar:hover { background: #990000; }
        .btn-editar { padding: 5px 10px; background: #e07b00; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-editar:hover { background: #b56200; }
        .btn-cancelar { padding: 8px 15px; background: #888; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; margin-left: 8px; }
        .btn-cancelar:hover { background: #666; }
        .error { color: red; margin-top: 10px; }
        .exito { color: green; margin-top: 10px; }
        .oculto { display: none; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; min-height: 10px; }
        .tag { background: #e8f0ff; border: 1px solid #b0ccee; border-radius: 12px; padding: 3px 10px; font-size: 0.85em; display: inline-flex; align-items: center; gap: 6px; }
        .tag button { background: none; border: none; color: #cc0000; cursor: pointer; padding: 0; margin: 0; font-size: 1.1em; line-height: 1; }
        .tag-input-row { display: flex; gap: 8px; margin-top: 6px; }
        .tag-input-row input { flex: 1; margin-top: 0; }
        .btn-add-tag { padding: 8px 14px; margin-top: 0; background: #28a745; }
        .btn-add-tag:hover { background: #1e7e34; }
    </style>
    <script>
        (function() {
            const p = new URLSearchParams(window.location.search);
            const token = p.get('token') || sessionStorage.getItem('auth_token');
            const rol   = p.get('rol')   || sessionStorage.getItem('auth_rol');
            if (token) sessionStorage.setItem('auth_token', token);
            if (rol)   sessionStorage.setItem('auth_rol',   rol);
            if (!rol || !['Administrador', 'Operador'].includes(rol)) {
                window.location.href = '/';
            }
        })();
    </script>
</head>
<body>
    <div class="nav"><a href="javascript:void(0)" onclick="volverAlHome()">← Volver</a></div>
    <h1>Gestión de Vehículos</h1>

    <!-- Formulario crear -->
    <div class="formulario" id="formularioCrear">
        <h2>Crear Vehículo</h2>
        <label>Matrícula</label>
        <input type="text" id="matricula" placeholder="Ej: ABC-1234">
        <label>Tipo</label>
        <input type="text" id="tipo" placeholder="Ej: Sedán">
        <label>Capacidad</label>
        <input type="number" id="capacidad" placeholder="4">
        <label>Dispositivo GPS</label>
        <select id="dispositivoGps">
            <option value="">Cargando dispositivos...</option>
        </select>
        <label>Características <span style="font-weight:normal;color:#666;font-size:0.85em">(mínimo una)</span></label>
        <div class="tag-input-row">
            <input type="text" id="nuevaCaracteristica" placeholder="Ej: Refrigerado, Rampa, Carga pesada..." onkeydown="if(event.key==='Enter'){event.preventDefault();agregarCaracteristica()}">
            <button class="btn-add-tag" onclick="agregarCaracteristica()">+ Agregar</button>
        </div>
        <div class="tags-container" id="tagsCaracteristicas"></div>
        <br>
        <button onclick="crearVehiculo()">Crear</button>
        <div id="mensajeCrear"></div>
    </div>

    <!-- Formulario editar -->
    <div class="formulario oculto" id="formularioEditar">
        <h2>Editar Vehículo <span id="tituloIdEditar"></span></h2>
        <input type="hidden" id="editarId">
        <input type="hidden" id="editarMatriculaOriginal">
        <label>Matrícula</label>
        <input type="text" id="editarMatricula">
        <label>Tipo</label>
        <input type="text" id="editarTipo">
        <label>Capacidad</label>
        <input type="number" id="editarCapacidad">
        <label>Dispositivo GPS</label>
        <select id="editarDispositivoGps">
            <option value="">Cargando dispositivos...</option>
        </select>
        <label>Características <span style="font-weight:normal;color:#666;font-size:0.85em">(mínimo una)</span></label>
        <div class="tag-input-row">
            <input type="text" id="editarNuevaCaracteristica" placeholder="Ej: Refrigerado..." onkeydown="if(event.key==='Enter'){event.preventDefault();agregarCaracteristicaEditar()}">
            <button class="btn-add-tag" onclick="agregarCaracteristicaEditar()">+ Agregar</button>
        </div>
        <div class="tags-container" id="editarTagsCaracteristicas"></div>
        <br>
        <button onclick="guardarEdicion()">Guardar cambios</button>
        <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
        <div id="mensajeEditar"></div>
    </div>

    <h2>Listado</h2>
    <table id="tablaVehiculos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Matrícula</th>
                <th>Tipo</th>
                <th>Capacidad</th>
                <th>Características</th>
                <th>Dispositivo GPS</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7">Cargando...</td></tr>
        </tbody>
    </table>

    <script>
        function volverAlHome() {
            if (history.length > 1) { history.back(); } else { window.location.href = 'http://localhost:3000/'; }
        }

        // ── Características (tags) ──────────────────────────────────────────────
        let caracteristicas = [];
        let caracteristicasEditar = [];

        function agregarCaracteristica() {
            const input = document.getElementById('nuevaCaracteristica');
            const val = input.value.trim();
            if (!val) return;
            if (caracteristicas.includes(val)) { input.value = ''; return; }
            caracteristicas.push(val);
            input.value = '';
            renderTags('tagsCaracteristicas', caracteristicas, (i) => { caracteristicas.splice(i, 1); renderTags('tagsCaracteristicas', caracteristicas, arguments.callee); });
        }

        function agregarCaracteristicaEditar() {
            const input = document.getElementById('editarNuevaCaracteristica');
            const val = input.value.trim();
            if (!val) return;
            if (caracteristicasEditar.includes(val)) { input.value = ''; return; }
            caracteristicasEditar.push(val);
            input.value = '';
            renderTagsEditar();
        }

        function renderTags(containerId, arr, onRemove) {
            document.getElementById(containerId).innerHTML = arr.map((t, i) =>
                `<span class="tag">${t}<button type="button" onclick="(${onRemove.toString()})(${i})">×</button></span>`
            ).join('');
        }

        function renderTagsEditar() {
            document.getElementById('editarTagsCaracteristicas').innerHTML = caracteristicasEditar.map((t, i) =>
                `<span class="tag">${t}<button type="button" onclick="caracteristicasEditar.splice(${i},1);renderTagsEditar()">×</button></span>`
            ).join('');
        }

        function renderTagsCrear() {
            document.getElementById('tagsCaracteristicas').innerHTML = caracteristicas.map((t, i) =>
                `<span class="tag">${t}<button type="button" onclick="caracteristicas.splice(${i},1);renderTagsCrear()">×</button></span>`
            ).join('');
        }

        // override agregarCaracteristica to use renderTagsCrear
        function agregarCaracteristica() {
            const input = document.getElementById('nuevaCaracteristica');
            const val = input.value.trim();
            if (!val) return;
            if (!caracteristicas.includes(val)) caracteristicas.push(val);
            input.value = '';
            renderTagsCrear();
        }

        async function cargarDispositivosEnSelect(selectId, dispositivoActual = null, excluirMatricula = null) {
            const sel = document.getElementById(selectId);
            sel.innerHTML = '<option value="">Cargando...</option>';

            const url = excluirMatricula
                ? `/api/dispositivos/disponibles?excluirMatricula=${encodeURIComponent(excluirMatricula)}`
                : '/api/dispositivos/disponibles';

            try {
                const resp = await fetch(url);
                const json = await resp.json();
                const dispositivos = json.data || [];

                sel.innerHTML = '<option value="">— Seleccioná un dispositivo GPS —</option>';

                if (dispositivos.length === 0) {
                    sel.innerHTML = '<option value="" disabled>Sin dispositivos disponibles</option>';
                    return;
                }

                dispositivos.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = `GPS #${d.id}${d.nombre ? ' — ' + d.nombre : ''}`;
                    if (String(d.id) === String(dispositivoActual)) opt.selected = true;
                    sel.appendChild(opt);
                });
            } catch (e) {
                sel.innerHTML = '<option value="">Error al cargar dispositivos</option>';
            }
        }

        async function cargarVehiculos() {
            try {
                const respuesta = await fetch('/api/vehiculos');
                const json = await respuesta.json();
                const vehiculos = json.data || [];

                const tbody = document.querySelector('#tablaVehiculos tbody');
                if (vehiculos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No hay vehículos</td></tr>';
                    return;
                }

                tbody.innerHTML = vehiculos.map(v => {
                    const tags = (v.caracteristicas || []).map(c =>
                        `<span style="background:#e8f0ff;border:1px solid #b0ccee;border-radius:10px;padding:2px 8px;font-size:0.8em;white-space:nowrap">${c}</span>`
                    ).join(' ');
                    const caraJson = JSON.stringify(v.caracteristicas || []).replace(/'/g, "\\'");
                    return `<tr>
                        <td>${v.id}</td>
                        <td>${v.matricula}</td>
                        <td>${v.tipo}</td>
                        <td>${v.capacidad}</td>
                        <td style="max-width:200px">${tags || '—'}</td>
                        <td>GPS #${v.dispositivoGps || '—'}</td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicion(${v.id}, '${v.matricula}', '${v.tipo}', ${v.capacidad}, '${v.dispositivoGps || ''}', ${caraJson})">Editar</button>
                            <button class="btn-eliminar" onclick="eliminarVehiculo(${v.id})">Eliminar</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (err) {
                document.querySelector('#tablaVehiculos tbody').innerHTML =
                    `<tr><td colspan="6" class="error">Error: ${err.message}</td></tr>`;
            }
        }

        async function crearVehiculo() {
            const matricula = document.getElementById('matricula').value;
            const tipo = document.getElementById('tipo').value;
            const capacidad = document.getElementById('capacidad').value;
            const dispositivoGps = document.getElementById('dispositivoGps').value;

            if (!matricula || !tipo || !capacidad || !dispositivoGps) {
                document.getElementById('mensajeCrear').innerHTML = '<div class="error">Completá todos los campos, incluyendo el dispositivo GPS</div>';
                return;
            }
            if (caracteristicas.length === 0) {
                document.getElementById('mensajeCrear').innerHTML = '<div class="error">Agregá al menos una característica</div>';
                return;
            }

            try {
                const respuesta = await fetch('/api/vehiculos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        matricula,
                        tipo,
                        capacidad: Number(capacidad),
                        dispositivoGps: Number(dispositivoGps),
                        caracteristicas
                    })
                });

                if (respuesta.ok) {
                    document.getElementById('mensajeCrear').innerHTML = '<div class="exito">Vehículo creado</div>';
                    document.getElementById('matricula').value = '';
                    document.getElementById('tipo').value = '';
                    document.getElementById('capacidad').value = '';
                    caracteristicas = [];
                    renderTagsCrear();
                    cargarVehiculos();
                    cargarDispositivosEnSelect('dispositivoGps');
                } else {
                    const err = await respuesta.json();
                    document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function abrirEdicion(id, matricula, tipo, capacidad, dispositivoGps, caras = []) {
            document.getElementById('formularioEditar').classList.remove('oculto');
            document.getElementById('formularioCrear').classList.add('oculto');
            document.getElementById('tituloIdEditar').textContent = `#${id}`;
            document.getElementById('editarId').value = id;
            document.getElementById('editarMatricula').value = matricula;
            document.getElementById('editarMatriculaOriginal').value = matricula;
            document.getElementById('editarTipo').value = tipo;
            document.getElementById('editarCapacidad').value = capacidad;
            document.getElementById('mensajeEditar').innerHTML = '';
            caracteristicasEditar = Array.isArray(caras) ? [...caras] : [];
            renderTagsEditar();
            await cargarDispositivosEnSelect('editarDispositivoGps', dispositivoGps, matricula);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('formularioEditar').classList.add('oculto');
            document.getElementById('formularioCrear').classList.remove('oculto');
        }

        async function guardarEdicion() {
            const id = document.getElementById('editarId').value;
            const matricula = document.getElementById('editarMatricula').value;
            const tipo = document.getElementById('editarTipo').value;
            const capacidad = document.getElementById('editarCapacidad').value;
            const dispositivoGps = document.getElementById('editarDispositivoGps').value;

            if (!matricula || !tipo || !capacidad || !dispositivoGps) {
                document.getElementById('mensajeEditar').innerHTML = '<div class="error">Completá todos los campos, incluyendo el dispositivo GPS</div>';
                return;
            }
            if (caracteristicasEditar.length === 0) {
                document.getElementById('mensajeEditar').innerHTML = '<div class="error">Agregá al menos una característica</div>';
                return;
            }

            try {
                const respuesta = await fetch(`/api/vehiculos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        matricula,
                        tipo,
                        capacidad: Number(capacidad),
                        dispositivoGps: Number(dispositivoGps),
                        caracteristicas: caracteristicasEditar
                    })
                });

                if (respuesta.ok) {
                    document.getElementById('mensajeEditar').innerHTML = '<div class="exito">Vehículo actualizado</div>';
                    cargarVehiculos();
                    cargarDispositivosEnSelect('dispositivoGps'); // refrescar disponibles en form crear
                    setTimeout(cancelarEdicion, 1000);
                } else {
                    const err = await respuesta.json();
                    document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function eliminarVehiculo(id) {
            if (!confirm('¿Eliminar este vehículo?')) return;
            try {
                const respuesta = await fetch(`/api/vehiculos/${id}`, { method: 'DELETE' });
                if (respuesta.ok) {
                    cargarVehiculos();
                    cargarDispositivosEnSelect('dispositivoGps'); // el dispositivo vuelve a estar disponible
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Carga inicial
        cargarVehiculos();
        cargarDispositivosEnSelect('dispositivoGps');
        setInterval(cargarVehiculos, 5000);
    </script>
</body>
</html>
