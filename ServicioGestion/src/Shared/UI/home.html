<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServicioGestion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        h2 { color: #555; font-size: 1rem; margin: 20px 0 8px 0; }
        .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        a { padding: 10px 15px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .info-rol { font-size: 0.9em; color: #555; }
        .btn-logout { padding: 8px 14px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .btn-logout:hover { background: #990000; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin:0">ServicioGestion</h1>
        <div style="display:flex;align-items:center;gap:12px">
            <span class="info-rol" id="infoRol"></span>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
    <div id="contenido"></div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('auth_token');
        const rol   = new URLSearchParams(window.location.search).get('rol')   || sessionStorage.getItem('auth_rol');
        if (token) sessionStorage.setItem('auth_token', token);
        if (rol)   sessionStorage.setItem('auth_rol',   rol);

        if (!token || !rol) {
            window.location.href = 'http://localhost:3002/';
        }

        document.getElementById('infoRol').textContent = 'Sesión: ' + rol;

        const PAGINAS = {
            'Administrador': [
                { seccion: 'Usuarios',   links: [
                    { label: 'Administradores',       href: '/administradores-ui' },
                    { label: 'Operadores',             href: '/operadores-ui' },
                    { label: 'Conductores',            href: '/conductores-ui' },
                    { label: 'Clientes Personales',    href: '/clientes-personales-ui' },
                    { label: 'Clientes Empresariales', href: '/clientes-empresariales-ui' },
                ]},
                { seccion: 'Catálogo', links: [
                    { label: 'Productos',           href: '/productos-ui' },
                    { label: 'Zonas Geográficas',   href: '/zonas-geograficas-ui' },
                ]},
                { seccion: 'Operación', links: [
                    { label: 'Vehículos',           href: 'http://localhost:3000/vehiculos-ui' },
                    { label: 'Dispositivos GPS',    href: 'http://localhost:3000/dispositivos-ui' },
                ]},
                { seccion: 'Pagos',    links: [{ label: 'Pagos', href: '/pagos-ui' }] },
                { seccion: 'Reservas', links: [
                    { label: 'Reservas',   href: '/reservas-ui' },
                    { label: 'Viajes',     href: '/viajes-ui' },
                    { label: 'Incidentes', href: '/incidentes-ui' },
                ]},
                { seccion: 'Monitoreo', links: [{ label: 'Métricas', href: '/metricas-ui' }] },
            ],
            'Operador': [
                { seccion: 'Mi sección', links: [{ label: 'Operadores', href: '/operadores-ui' }] },
                { seccion: 'Reservas',   links: [
                    { label: 'Reservas',   href: '/reservas-ui' },
                    { label: 'Viajes',     href: '/viajes-ui' },
                    { label: 'Incidentes', href: '/incidentes-ui' },
                ]},
            ],
            'Conductor': [
                { seccion: 'Mis viajes', links: [{ label: 'Mis viajes asignados', href: '/mis-viajes-ui' }] },
                { seccion: 'Mi perfil',  links: [{ label: 'Mis datos',            href: '/conductores-ui' }] },
            ],
            'ClientePersonal': [
                { seccion: 'Mi sección', links: [{ label: 'Mis datos y reservas', href: '/clientes-personales-ui' }] },
            ],
            'ClienteEmpresa': [
                { seccion: 'Mi sección', links: [
                    { label: 'Mis datos y reservas', href: '/clientes-empresariales-ui' },
                    { label: 'Productos',             href: '/productos-ui' },
                ]},
            ],
        };

        const secciones = PAGINAS[rol] || [];
        const contenido = document.getElementById('contenido');

        if (secciones.length === 0) {
            contenido.innerHTML = '<p>No hay páginas disponibles para el rol <strong>' + rol + '</strong>.</p>';
        } else {
            contenido.innerHTML = secciones.map(s => `
                <h2>${s.seccion}</h2>
                <div class="nav">
                    ${s.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('')}
                </div>
            `).join('');
        }

        async function logout() {
            try {
                await fetch('http://localhost:3002/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
            } catch (_) {}
            sessionStorage.removeItem('auth_token');
            sessionStorage.removeItem('auth_rol');
            window.location.href = 'http://localhost:3002/';
        }
    </script>
</body>
</html>
