<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - Conductor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        .nav { margin-bottom: 20px; }
        a { padding: 8px 12px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.82em; font-weight: bold; }
        .badge-Pendiente { background: #fff3cd; color: #856404; }
        .badge-Encurso   { background: #d1ecf1; color: #0c5460; }
        .badge-EnCurso   { background: #d1ecf1; color: #0c5460; }
        .btn-iniciar   { padding: 6px 14px; background: #198754; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-iniciar:hover { background: #146c43; }
        .btn-finalizar { padding: 6px 14px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-finalizar:hover { background: #b02a37; }
        .id-cell { font-family: monospace; font-size: 0.82em; color: #555; }
        .sin-viajes { color: #666; font-style: italic; padding: 20px 0; }
        #mensajeAccion { margin-top: 12px; font-weight: bold; }
        .exito { color: #198754; }
        .error  { color: #dc3545; }
    </style>
</head>
<body>
    <div class="nav"><a href="/">← Volver</a></div>
    <h1>Mis Viajes Asignados</h1>
    <p style="color:#555">Se actualiza automáticamente cada 10 segundos.</p>
    <div id="mensajeAccion"></div>

    <table id="tablaViajes">
        <thead>
            <tr>
                <th>ID Viaje</th>
                <th>Reserva</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Fecha</th>
                <th>Vehículo</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody><tr><td colspan="8">Cargando...</td></tr></tbody>
    </table>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('auth_token');
        const rol   = new URLSearchParams(window.location.search).get('rol')   || sessionStorage.getItem('auth_rol');
        if (token) sessionStorage.setItem('auth_token', token);
        if (rol)   sessionStorage.setItem('auth_rol',   rol);
        if (!token) window.location.href = 'http://localhost:3002/?redirect=http://localhost:3001';

        function apiFetch(url, options = {}) {
            options.headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
            return fetch(url, options);
        }

        function mostrarMensaje(texto, tipo) {
            const el = document.getElementById('mensajeAccion');
            el.textContent = texto;
            el.className = tipo;
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 3000);
        }

        async function cargarMisViajes() {
            try {
                const res = await apiFetch('/api/viajes/mis-viajes');
                const json = await res.json();
                const viajes = json.data || [];
                const tbody = document.querySelector('#tablaViajes tbody');
                if (viajes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="sin-viajes">No tenés viajes asignados pendientes.</td></tr>';
                    return;
                }
                tbody.innerHTML = viajes.map(v => {
                    const estadoKey = v.estado.replace(/\s/g,'');
                    const acciones = v.estado === 'Pendiente'
                        ? `<button class="btn-iniciar" onclick="iniciarViaje('${v.id}')">Iniciar traslado</button>`
                        : v.estado === 'En curso'
                        ? `<button class="btn-finalizar" onclick="finalizarViaje('${v.id}')">Finalizar traslado</button>`
                        : '—';
                    return `
                        <tr>
                            <td class="id-cell">${v.id}</td>
                            <td class="id-cell">${v.reservaId}</td>
                            <td>${v.origen}</td>
                            <td>${v.destino}</td>
                            <td>${new Date(v.fecha).toLocaleString('es-AR')}</td>
                            <td class="id-cell">${v.vehiculo || '—'}</td>
                            <td><span class="badge badge-${estadoKey}">${v.estado}</span></td>
                            <td>${acciones}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                document.querySelector('#tablaViajes tbody').innerHTML =
                    `<tr><td colspan="8" class="error">Error: ${err.message}</td></tr>`;
            }
        }

        async function iniciarViaje(id) {
            try {
                const res = await apiFetch(`/api/viajes/${id}/iniciar`, { method: 'POST' });
                if (res.ok) {
                    mostrarMensaje('Traslado iniciado', 'exito');
                    cargarMisViajes();
                } else {
                    const err = await res.json();
                    mostrarMensaje('Error: ' + err.error, 'error');
                }
            } catch (err) {
                mostrarMensaje('Error: ' + err.message, 'error');
            }
        }

        async function finalizarViaje(id) {
            try {
                const res = await apiFetch(`/api/viajes/${id}/finalizar`, { method: 'POST' });
                if (res.ok) {
                    mostrarMensaje('Traslado finalizado', 'exito');
                    cargarMisViajes();
                } else {
                    const err = await res.json();
                    mostrarMensaje('Error: ' + err.error, 'error');
                }
            } catch (err) {
                mostrarMensaje('Error: ' + err.message, 'error');
            }
        }

        cargarMisViajes();
        setInterval(cargarMisViajes, 10000);
    </script>
</body>
</html>
