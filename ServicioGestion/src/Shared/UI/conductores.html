<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductores - ServicioGestion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        h2 { color: #444; }
        .nav { margin-bottom: 20px; }
        a { padding: 8px 12px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        .formulario { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #ddd; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 70px; }
        button { padding: 8px 15px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .btn-eliminar { padding: 5px 10px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-eliminar:hover { background: #990000; }
        .btn-editar { padding: 5px 10px; background: #e07b00; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-editar:hover { background: #b56200; }
        .btn-cancelar { padding: 8px 15px; background: #888; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; margin-left: 8px; }
        .btn-cancelar:hover { background: #666; }
        .error { color: red; margin-top: 10px; }
        .exito { color: green; margin-top: 10px; }
        .oculto { display: none; }
        .id-cell { font-family: monospace; font-size: 0.82em; color: #555; }
    </style>
</head>
<body>
    <div class="nav"><a href="/">← Volver</a></div>
    <h1>Gestión de Conductores</h1>

    <div class="formulario oculto" id="formularioEditar">
        <h2>Editar Conductor <span id="tituloIdEditar"></span></h2>
        <input type="hidden" id="editarId">
        <label>Cédula</label>
        <input type="text" id="editarCedula">
        <label>Nombre</label>
        <input type="text" id="editarNombre">
        <br>
        <button onclick="guardarEdicion()">Guardar cambios</button>
        <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
        <div id="mensajeEditar"></div>
    </div>

    <h2>Listado</h2>
    <table id="tablaConductores">
        <thead>
            <tr><th>ID</th><th>Cédula</th><th>Nombre</th><th>Rol</th><th>Acción</th></tr>
        </thead>
        <tbody><tr><td colspan="5">Cargando...</td></tr></tbody>
    </table>

    <div class="formulario" id="formularioIncidente" style="margin-top: 30px;">
        <h2>Reportar Incidencia</h2>
        <label>Descripción</label>
        <textarea id="incDescripcion" placeholder="Describí el incidente ocurrido..."></textarea>
        <label>Fecha</label>
        <input type="datetime-local" id="incFecha">
        <label>ID de Reserva</label>
        <input type="text" id="incReservaId" placeholder="ID de la reserva relacionada">
        <label>Estado</label>
        <select id="incEstado">
            <option value="abierto">Abierto</option>
            <option value="en_revision">En revisión</option>
            <option value="resuelto">Resuelto</option>
        </select>
        <label>Severidad</label>
        <select id="incSeveridad">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
        </select>
        <br>
        <button onclick="reportarIncidencia()">Reportar</button>
        <div id="mensajeIncidente"></div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('auth_token');
        const rol   = new URLSearchParams(window.location.search).get('rol')   || sessionStorage.getItem('auth_rol');
        if (token) sessionStorage.setItem('auth_token', token);
        if (rol)   sessionStorage.setItem('auth_rol',   rol);
        if (!token) window.location.href = 'http://localhost:3002/';

        // Setear fecha por defecto al momento actual
        const ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
        document.getElementById('incFecha').value = ahora.toISOString().slice(0, 16);

        function apiFetch(url, options = {}) {
            options.headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
            return fetch(url, options);
        }

        let items = [];

        async function cargarConductores() {
            try {
                const res = await apiFetch('/api/conductores');
                const json = await res.json();
                items = json.data || [];
                const tbody = document.querySelector('#tablaConductores tbody');
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No hay conductores</td></tr>';
                    return;
                }
                tbody.innerHTML = items.map((item, i) => `
                    <tr>
                        <td class="id-cell">${item.id}</td>
                        <td>${item.cedula}</td>
                        <td>${item.nombre}</td>
                        <td>${item.rol}</td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicion(${i})">Editar</button>
                            <button class="btn-eliminar" onclick="eliminarConductor('${item.id}')">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.querySelector('#tablaConductores tbody').innerHTML =
                    `<tr><td colspan="5" class="error">Error: ${err.message}</td></tr>`;
            }
        }

        function abrirEdicion(indice) {
            const item = items[indice];
            document.getElementById('formularioEditar').classList.remove('oculto');
            document.getElementById('tituloIdEditar').textContent = `#${item.id}`;
            document.getElementById('editarId').value = item.id;
            document.getElementById('editarCedula').value = item.cedula;
            document.getElementById('editarNombre').value = item.nombre;
            document.getElementById('mensajeEditar').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('formularioEditar').classList.add('oculto');
        }

        async function guardarEdicion() {
            const id = document.getElementById('editarId').value;
            const cedula = document.getElementById('editarCedula').value;
            const nombre = document.getElementById('editarNombre').value;
            if (!cedula || !nombre) {
                document.getElementById('mensajeEditar').innerHTML = '<div class="error">Completá todos los campos</div>';
                return;
            }
            try {
                const res = await apiFetch(`/api/conductores/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cedula, nombre })
                });
                if (res.ok) {
                    document.getElementById('mensajeEditar').innerHTML = '<div class="exito">Conductor actualizado</div>';
                    cargarConductores();
                    setTimeout(cancelarEdicion, 1000);
                } else {
                    const err = await res.json();
                    document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function eliminarConductor(id) {
            if (!confirm('¿Eliminar este conductor?')) return;
            try {
                const res = await apiFetch(`/api/conductores/${id}`, { method: 'DELETE' });
                if (res.ok) cargarConductores();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function reportarIncidencia() {
            const descripcion = document.getElementById('incDescripcion').value;
            const fecha       = document.getElementById('incFecha').value;
            const reservaId   = document.getElementById('incReservaId').value;
            const estado      = document.getElementById('incEstado').value;
            const severidad   = document.getElementById('incSeveridad').value;
            const msg         = document.getElementById('mensajeIncidente');

            if (!descripcion || !fecha || !reservaId) {
                msg.innerHTML = '<div class="error">Completá descripción, fecha e ID de reserva</div>';
                return;
            }
            try {
                const res = await apiFetch('/api/incidentes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descripcion, fecha, reservaId, estado, severidad })
                });
                if (res.ok) {
                    msg.innerHTML = '<div class="exito">Incidencia reportada correctamente</div>';
                    document.getElementById('incDescripcion').value = '';
                    document.getElementById('incReservaId').value = '';
                    document.getElementById('incEstado').value = 'abierto';
                    document.getElementById('incSeveridad').value = 'baja';
                    const nuevo = new Date();
                    nuevo.setMinutes(nuevo.getMinutes() - nuevo.getTimezoneOffset());
                    document.getElementById('incFecha').value = nuevo.toISOString().slice(0, 16);
                } else {
                    const err = await res.json();
                    msg.innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                msg.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        cargarConductores();
        setInterval(cargarConductores, 5000);
    </script>
</body>
</html>
