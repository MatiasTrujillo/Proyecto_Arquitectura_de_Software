<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores - ServicioGestion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: white; }
        h1 { margin-top: 0; color: #333; }
        h2 { color: #444; }
        .nav { margin-bottom: 20px; }
        a { padding: 8px 12px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
        a:hover { background: #0052a3; }
        .formulario { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #ddd; }
        .accion { background: #f0f4ff; padding: 15px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccd6f6; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; background: white; }
        .seleccion-info { background: #d8f0ff; border: 1px solid #90c4e8; border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: 0.9em; display: none; }
        button { padding: 8px 15px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .btn-eliminar { padding: 5px 10px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-eliminar:hover { background: #990000; }
        .btn-editar { padding: 5px 10px; background: #e07b00; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-editar:hover { background: #b56200; }
        .btn-cancelar { padding: 8px 15px; background: #888; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; margin-left: 8px; }
        .btn-cancelar:hover { background: #666; }
        .error { color: red; margin-top: 10px; }
        .exito { color: green; margin-top: 10px; }
        .oculto { display: none; }
        .id-cell { font-family: monospace; font-size: 0.82em; color: #555; }
        .resultado { background: #e8e8e8; padding: 10px; border-radius: 4px; margin-top: 10px; font-family: monospace; white-space: pre-wrap; font-size: 0.88em; }
    </style>
</head>
<body>
    <div class="nav"><a href="/">← Volver</a></div>
    <h1>Gestión de Operadores</h1>

    <div class="formulario" id="formularioCrear">
        <h2>Crear Operador</h2>
        <label>Cédula</label>
        <input type="text" id="cedula" placeholder="Ej: 12345678">
        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Ej: María García">
        <label>Contraseña (para el acceso al sistema)</label>
        <input type="password" id="password" placeholder="Contraseña de acceso">
        <br>
        <button onclick="crearOperador()">Crear</button>
        <div id="mensajeCrear"></div>
    </div>

    <div class="formulario oculto" id="formularioEditar">
        <h2>Editar Operador <span id="tituloIdEditar"></span></h2>
        <input type="hidden" id="editarId">
        <label>Cédula</label>
        <input type="text" id="editarCedula">
        <label>Nombre</label>
        <input type="text" id="editarNombre">
        <br>
        <button onclick="guardarEdicion()">Guardar cambios</button>
        <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
        <div id="mensajeEditar"></div>
    </div>

    <h2>Listado</h2>
    <table id="tablaOperadores">
        <thead>
            <tr><th>ID</th><th>Cédula</th><th>Nombre</th><th>Rol</th><th>Acción</th></tr>
        </thead>
        <tbody><tr><td colspan="5">Cargando...</td></tr></tbody>
    </table>

    <h2 style="margin-top:30px">Acciones</h2>

    <div class="accion">
        <strong>Asignar Vehículo y Conductor a Reserva</strong>
        <label>Reserva</label>
        <select id="selReserva" onchange="onCambioReserva()">
            <option value="">— Seleccioná una reserva —</option>
        </select>
        <div class="seleccion-info" id="infoReserva"></div>

        <label>Conductor</label>
        <select id="selConductor">
            <option value="">— Seleccioná un conductor —</option>
        </select>

        <label>Vehículo</label>
        <select id="selVehiculo">
            <option value="">— Seleccioná un vehículo —</option>
        </select>

        <button onclick="asignarReserva()">Asignar</button>
        <div id="resultadoAsignar" class="resultado oculto"></div>
    </div>

    <div class="accion">
        <strong>Consultar Traslado</strong>
        <label>ID de Traslado</label>
        <input type="text" id="consultarTrasladoId" placeholder="ID del traslado">
        <button onclick="consultarTraslado()">Consultar</button>
        <div id="resultadoConsultar" class="resultado oculto"></div>
    </div>

    <div class="accion">
        <strong>Marcar Reserva No Reconocida</strong>
        <label>ID de Reserva</label>
        <input type="text" id="noReconocidaReservaId" placeholder="ID de la reserva">
        <button onclick="reservaNoReconocida()">Marcar</button>
        <div id="resultadoNoReconocida" class="resultado oculto"></div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('auth_token');
        const rol   = new URLSearchParams(window.location.search).get('rol')   || sessionStorage.getItem('auth_rol');
        if (token) sessionStorage.setItem('auth_token', token);
        if (rol)   sessionStorage.setItem('auth_rol',   rol);
        if (!token) window.location.href = 'http://localhost:3002/';
        function apiFetch(url, options = {}) {
            options.headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
            return fetch(url, options);
        }

        let items = [];

        async function cargarOperadores() {
            try {
                const res = await apiFetch('/api/operadores');
                const json = await res.json();
                items = json.data || [];
                const tbody = document.querySelector('#tablaOperadores tbody');
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No hay operadores</td></tr>';
                    return;
                }
                tbody.innerHTML = items.map((item, i) => `
                    <tr>
                        <td class="id-cell">${item.id}</td>
                        <td>${item.cedula}</td>
                        <td>${item.nombre}</td>
                        <td>${item.rol}</td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicion(${i})">Editar</button>
                            <button class="btn-eliminar" onclick="eliminarOperador('${item.id}')">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.querySelector('#tablaOperadores tbody').innerHTML =
                    `<tr><td colspan="5" class="error">Error: ${err.message}</td></tr>`;
            }
        }

        async function crearOperador() {
            const cedula   = document.getElementById('cedula').value.trim();
            const nombre   = document.getElementById('nombre').value.trim();
            const password = document.getElementById('password').value;
            if (!cedula || !nombre || !password) {
                document.getElementById('mensajeCrear').innerHTML = '<div class="error">Completá cédula, nombre y contraseña</div>';
                return;
            }
            try {
                const res = await apiFetch('/api/operadores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cedula, nombre, password })
                });
                if (res.ok) {
                    document.getElementById('mensajeCrear').innerHTML = '<div class="exito">Operador creado y acceso al sistema habilitado</div>';
                    document.getElementById('cedula').value   = '';
                    document.getElementById('nombre').value   = '';
                    document.getElementById('password').value = '';
                    cargarOperadores();
                } else {
                    const err = await res.json();
                    document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeCrear').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        function abrirEdicion(indice) {
            const item = items[indice];
            document.getElementById('formularioEditar').classList.remove('oculto');
            document.getElementById('formularioCrear').classList.add('oculto');
            document.getElementById('tituloIdEditar').textContent = `#${item.id}`;
            document.getElementById('editarId').value = item.id;
            document.getElementById('editarCedula').value = item.cedula;
            document.getElementById('editarNombre').value = item.nombre;
            document.getElementById('mensajeEditar').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('formularioEditar').classList.add('oculto');
            document.getElementById('formularioCrear').classList.remove('oculto');
        }

        async function guardarEdicion() {
            const id = document.getElementById('editarId').value;
            const cedula = document.getElementById('editarCedula').value;
            const nombre = document.getElementById('editarNombre').value;
            if (!cedula || !nombre) {
                document.getElementById('mensajeEditar').innerHTML = '<div class="error">Completá todos los campos</div>';
                return;
            }
            try {
                const res = await apiFetch(`/api/operadores/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cedula, nombre })
                });
                if (res.ok) {
                    document.getElementById('mensajeEditar').innerHTML = '<div class="exito">Operador actualizado</div>';
                    cargarOperadores();
                    setTimeout(cancelarEdicion, 1000);
                } else {
                    const err = await res.json();
                    document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensajeEditar').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function eliminarOperador(id) {
            if (!confirm('¿Eliminar este operador?')) return;
            try {
                const res = await apiFetch(`/api/operadores/${id}`, { method: 'DELETE' });
                if (res.ok) cargarOperadores();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        let reservasDisp = [];

        async function cargarDropdownsAsignacion() {
            await Promise.all([cargarReservasDisp(), cargarConductores(), cargarVehiculos()]);
        }

        async function cargarReservasDisp() {
            try {
                const res  = await apiFetch('/api/reservas/sin-viaje');
                const json = await res.json();
                reservasDisp = json.data || [];
                const sel = document.getElementById('selReserva');
                sel.innerHTML = '<option value="">— Seleccioná una reserva —</option>';
                reservasDisp.forEach(r => {
                    const fecha = new Date(r.fecha).toLocaleDateString('es-AR');
                    const opt   = document.createElement('option');
                    opt.value       = r.id;
                    opt.textContent = `#${r.id} · ${r.origen} → ${r.destino} (${fecha})`;
                    sel.appendChild(opt);
                });
                if (reservasDisp.length === 0) {
                    const opt = document.createElement('option');
                    opt.disabled = true;
                    opt.textContent = 'No hay reservas disponibles';
                    sel.appendChild(opt);
                }
            } catch (e) { console.error('Error cargando reservas:', e); }
        }

        async function cargarConductores() {
            const sel = document.getElementById('selConductor');
            try {
                const res  = await apiFetch('/api/conductores/disponibles');
                const json = await res.json();
                if (!res.ok) {
                    sel.innerHTML = `<option value="">[Error ${res.status}: ${json.error}]</option>`;
                    return;
                }
                const conductores = json.data || [];
                sel.innerHTML = '<option value="">— Seleccioná un conductor —</option>';
                if (conductores.length === 0) {
                    sel.innerHTML += '<option disabled>No hay conductores disponibles</option>';
                    return;
                }
                conductores.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value       = c.cedula;
                    opt.textContent = `${c.nombre} (cédula: ${c.cedula})`;
                    sel.appendChild(opt);
                });
            } catch (e) {
                sel.innerHTML = `<option value="">[Error de red: ${e.message}]</option>`;
            }
        }

        async function cargarVehiculos() {
            try {
                const res  = await fetch('http://localhost:3000/api/vehiculos', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const json = await res.json();
                const vehiculos = json.data || [];
                const sel = document.getElementById('selVehiculo');
                sel.innerHTML = '<option value="">— Seleccioná un vehículo —</option>';
                vehiculos.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value       = v.matricula;
                    opt.textContent = `${v.matricula} · ${v.tipo} (cap. ${v.capacidad})`;
                    sel.appendChild(opt);
                });
            } catch (e) { console.error('Error cargando vehículos:', e); }
        }

        function onCambioReserva() {
            const id    = document.getElementById('selReserva').value;
            const panel = document.getElementById('infoReserva');
            if (!id) { panel.style.display = 'none'; return; }
            const r = reservasDisp.find(x => String(x.id) === String(id));
            if (!r) { panel.style.display = 'none'; return; }
            panel.innerHTML = `<strong>Origen:</strong> ${r.origen} &nbsp;|&nbsp; <strong>Destino:</strong> ${r.destino} &nbsp;|&nbsp; <strong>Fecha:</strong> ${new Date(r.fecha).toLocaleString('es-AR')}`;
            panel.style.display = 'block';
        }

        async function asignarReserva() {
            const reservaId = document.getElementById('selReserva').value;
            const conductor = document.getElementById('selConductor').value;
            const vehiculo  = document.getElementById('selVehiculo').value;
            const el        = document.getElementById('resultadoAsignar');
            el.classList.remove('oculto');
            if (!reservaId || !conductor || !vehiculo) {
                el.textContent = 'Seleccioná reserva, conductor y vehículo.';
                return;
            }
            try {
                const res  = await apiFetch(`/api/reservas/${reservaId}/asignar`, {
                    method:  'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ vehiculo, conductor })
                });
                const json = await res.json();
                el.textContent = res.ok
                    ? `✓ Asignado correctamente. Viaje creado para reserva #${reservaId}`
                    : `Error: ${json.error}`;
                if (res.ok) {
                    document.getElementById('selReserva').value   = '';
                    document.getElementById('selConductor').value = '';
                    document.getElementById('selVehiculo').value  = '';
                    document.getElementById('infoReserva').style.display = 'none';
                    cargarReservasDisp();
                }
            } catch (err) {
                el.textContent = 'Error: ' + err.message;
            }
        }

        async function consultarTraslado() {
            const id = document.getElementById('consultarTrasladoId').value;
            if (!id) return;
            try {
                const res = await apiFetch(`/api/operadores/${id}/consultar-traslado`);
                const json = await res.json();
                const el = document.getElementById('resultadoConsultar');
                el.classList.remove('oculto');
                el.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                const el = document.getElementById('resultadoConsultar');
                el.classList.remove('oculto');
                el.textContent = 'Error: ' + err.message;
            }
        }

        async function reservaNoReconocida() {
            const id = document.getElementById('noReconocidaReservaId').value;
            if (!id) return;
            try {
                const res = await apiFetch(`/api/operadores/${id}/reserva-no-reconocida`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const json = await res.json();
                const el = document.getElementById('resultadoNoReconocida');
                el.classList.remove('oculto');
                el.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                const el = document.getElementById('resultadoNoReconocida');
                el.classList.remove('oculto');
                el.textContent = 'Error: ' + err.message;
            }
        }

        cargarOperadores();
        cargarDropdownsAsignacion();
        setInterval(cargarOperadores, 5000);
    </script>
</body>
</html>
