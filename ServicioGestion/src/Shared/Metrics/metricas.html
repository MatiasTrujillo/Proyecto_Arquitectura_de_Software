        .nav { margin-bottom: 20px; }

        .fila-metodo td:first-child { padding-left: 28px; }
        .fila-metodo { font-size: 0.95rem; }

        .metodo {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            min-width: 52px;
            text-align: center;
            margin-right: 6px;
        }
        .metodo-GET    { background: #d4edda; color: #155724; }
        .metodo-POST   { background: #cce5ff; color: #004085; }
        .metodo-PUT    { background: #fff3cd; color: #856404; }
        .metodo-DELETE { background: #f8d7da; color: #721c24; }
        .metodo-PATCH  { background: #e2d9f3; color: #4a235a; }
    </style>
</head>

            '/api/incidentes':    'Alta (POST) y consulta (GET) de incidentes.',
            '/api/incidentes/:id':'Consulta (GET), modificación (PUT) y baja (DELETE) de un incidente.',

            '/api/notificaciones/stream':  'Stream SSE de notificaciones en tiempo real.',

            '/api/correos/:id':            'Elimina un correo por ID.',

            '/internal/viajes/vehiculo/:matricula/alertas': 'Interno: alerta GPS en viaje activo de un vehículo.',
        };

        const descripcionesSistema = {
            'Uptime':              'Tiempo que lleva el servidor activo desde el último inicio.',
            'Rutas':               'Combinaciones método+ruta que han recibido al menos una solicitud.',
            'Categorías':          'Cantidad de categorías de endpoints registradas.',
            'Solicitudes totales': 'Total de solicitudes recibidas desde el inicio del servidor.',
        };

        const descripcionesPorCategoria = {
            'general':               'Solicitudes a páginas UI y endpoints fuera de /api.',
            'administradores':       'Solicitudes al módulo de administradores (/api/administradores).',
            'operadores':            'Solicitudes al módulo de operadores (/api/operadores).',
            'conductores':           'Solicitudes al módulo de conductores (/api/conductores).',
            'clientes-personales':   'Solicitudes al módulo de clientes personales (/api/clientes-personales).',
            'clientes-empresariales':'Solicitudes al módulo de clientes empresariales (/api/clientes-empresariales).',
            'productos':             'Solicitudes al módulo de productos (/api/productos).',
            'categorias':            'Solicitudes al módulo de categorías y reglas (/api/categorias, /api/reglas).',
            'reglas':                'Solicitudes al módulo de reglas de cotización (/api/reglas).',
            'zonas-geograficas':     'Solicitudes al módulo de zonas geográficas (/api/zonas-geograficas).',
            'pagos':                 'Solicitudes al módulo de pagos (/api/pagos).',
            'reservas':              'Solicitudes al módulo de reservas (/api/reservas).',
            'viajes':                'Solicitudes al módulo de viajes (/api/viajes).',
            'incidentes':            'Solicitudes al módulo de incidentes (/api/incidentes).',
            'notificaciones':        'Solicitudes al stream SSE de notificaciones (/api/notificaciones).',
            'clasificacion':         'Solicitudes al módulo de clasificación de bienes (/api/clasificacion).',
            'correos':               'Solicitudes al módulo de correos (/api/correos).',
            'clientes-frecuentes':   'Solicitudes al módulo de clientes frecuentes.',
            'cola':                  'Solicitudes a la cola de procesamiento (/api/cola).',
            'internal':              'Llamadas internas entre servicios (/internal/...).',
        };

        const descripcionesOtros = {
            'Consultas BD': 'Cantidad de veces que el servicio consultó la base de datos.',
        };

        // ── Detección del formato de clave ────────────────────────────────────

        const METODOS_HTTP = ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'HEAD', 'OPTIONS'];

        function parsearClave(clave) {
            const partes = clave.split(' ');
            if (partes.length >= 2 && METODOS_HTTP.includes(partes[0])) {
                return { tieneMetodo: true, metodo: partes[0], ruta: partes.slice(1).join(' ') };
            }
            return { tieneMetodo: false, metodo: null, ruta: clave };
        }

        // ── Agrupación por ruta ───────────────────────────────────────────────

        function agruparPorRuta(totales, rpms) {
            const grupos = new Map();

            for (const [clave, total] of Object.entries(totales)) {
                const { tieneMetodo, metodo, ruta } = parsearClave(clave);
                const rpm = rpms[clave] || 0;

                if (!grupos.has(ruta)) grupos.set(ruta, []);
                grupos.get(ruta).push({ metodo, total, rpm, clave, tieneMetodo });
            }

            return grupos;
        }

        function badgeMetodo(metodo) {
            return `<span class="metodo metodo-${metodo}">${metodo}</span>`;
        }

        // ── Renderizado ───────────────────────────────────────────────────────

        function renderizarTablaEndpoints(totales, rpms) {
            const grupos = agruparPorRuta(totales, rpms);
            const filas = [];

            for (const [ruta, entradas] of grupos.entries()) {
                const totalGrupo = entradas.reduce((acc, e) => acc + e.total, 0);
                const rpmGrupo   = entradas.reduce((acc, e) => acc + e.rpm, 0);
                const tieneMetodo = entradas[0].tieneMetodo;

                if (tieneMetodo) {
                    filas.push(`
                        <tr class="fila-grupo">
                            <td><code>${ruta}</code></td>
                            <td>${totalGrupo}</td>
                            <td>${rpmGrupo.toFixed(1)}</td>
                            <td></td>
                        </tr>
                    `);
                    for (const { metodo, total, rpm, clave } of entradas) {
                        const desc = descripcionesPorMetodoYRuta[clave] || '—';
                        filas.push(`
                            <tr class="fila-metodo">
                                <td>${badgeMetodo(metodo)}</td>
                                <td>${total}</td>
                                <td>${rpm.toFixed(1)}</td>
                                <td class="desc">${desc}</td>
                            </tr>
                        `);
                    }
                } else {
                    const descGeneral = descripcionGeneralPorRuta[ruta] || '—';
                    const metodosDisponibles = metodosPorRuta[ruta] || null;

                    filas.push(`
                        <tr class="fila-grupo">
                            <td><code>${ruta}</code></td>
                            <td>${totalGrupo}</td>
                            <td>${rpmGrupo.toFixed(1)}</td>
                            <td class="desc">${descGeneral}</td>
                        </tr>
                    `);

                    if (metodosDisponibles) {
                        for (const metodo of metodosDisponibles.split(', ')) {
                            const claveCompleta = `${metodo} ${ruta}`;
                            const desc = descripcionesPorMetodoYRuta[claveCompleta] || '—';
                            filas.push(`
                                <tr class="fila-metodo">
                                    <td>${badgeMetodo(metodo)}</td>
                                    <td>—</td>
                                    <td>—</td>
                                    <td class="desc">${desc}</td>
                                </tr>
                            `);
                        }
                    }
                }
            }

            return filas.join('') || '<tr><td colspan="4">Sin datos</td></tr>';
        }

        // ── Carga de datos ────────────────────────────────────────────────────

        async function cargarMetricas() {
            try {
                const respuesta = await fetch('/metricas');
                const datos = await respuesta.json();

                document.getElementById('ultimaActualizacion').textContent =
                    new Date(datos.ultima_actualizacion).toLocaleString('es-ES');

                // Sistema
                const uptime = datos.sistema.uptime_segundos;
                const textoUptime = uptime > 3600 ? (uptime / 3600).toFixed(1) + ' h'
                                  : uptime > 60   ? (uptime / 60).toFixed(1) + ' m'
                                  : uptime.toFixed(0) + ' s';

                const totalSolicitudes = Object.values(datos.solicitudes_totales_por_endpoint || {})
                    .reduce((a, b) => a + b, 0);

                const filasSistema = [
                    { etiqueta: 'Uptime',              valor: textoUptime },
                    { etiqueta: 'Rutas',               valor: datos.sistema.rutas_registradas },
                    { etiqueta: 'Categorías',          valor: datos.sistema.categorias_registradas },
                    { etiqueta: 'Solicitudes totales', valor: totalSolicitudes },
                ];
                document.querySelector('#tabla-sistema tbody').innerHTML = filasSistema.map(f => `
                    <tr>
                        <td>${f.etiqueta}</td>
                        <td><strong>${f.valor}</strong></td>
                        <td class="desc">${descripcionesSistema[f.etiqueta] || '—'}</td>
                    </tr>
                `).join('');

                // Endpoints
                document.querySelector('#tabla-endpoints tbody').innerHTML = renderizarTablaEndpoints(
                    datos.solicitudes_totales_por_endpoint || {},
                    datos.solicitudes_por_minuto_por_endpoint || {}
                );

                // Categorías
                const categorias = Object.entries(datos.solicitudes_totales_por_categoria || {});
                document.querySelector('#tabla-categorias tbody').innerHTML = categorias.map(([cat, total]) => {
                    const rpm = datos.solicitudes_por_minuto_por_categoria?.[cat] || 0;
                    return `
                        <tr>
                            <td>${cat}</td>
                            <td>${total}</td>
                            <td>${rpm.toFixed(1)}</td>
                            <td class="desc">${descripcionesPorCategoria[cat] || '—'}</td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="4">Sin datos</td></tr>';

                // Otros
                document.querySelector('#tabla-otros tbody').innerHTML = `
                    <tr>
                        <td>Consultas BD</td>
                        <td><strong>${datos.consultas_bd_totales || 0}</strong></td>
                        <td class="desc">${descripcionesOtros['Consultas BD']}</td>
                    </tr>
                `;

            } catch (err) {
                alert('Error al cargar métricas: ' + err.message);
            }
        }

        document.getElementById('btnActualizar').addEventListener('click', cargarMetricas);
        document.getElementById('intervalo').addEventListener('change', (e) => {
            clearInterval(window.__temporizador);
            const intervalo = Number(e.target.value);
            if (intervalo > 0) window.__temporizador = setInterval(cargarMetricas, intervalo);
        });

        cargarMetricas();
    </script>
